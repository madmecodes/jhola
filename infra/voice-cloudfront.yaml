AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudFront in front of the Jhola voice ALB, so the browser gets wss:// with a trusted certificate
  without a custom domain. Deployed in the Bedrock account (590183982967), because the infra account
  is not verified for CloudFront; the origin is just the public ALB DNS name of the jhola-voice stack.

Parameters:
  AlbDomainName:
    Type: String
    Description: Public DNS name of the jhola-voice ALB (stack output AlbDns)

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Jhola voice WebSocket (wss)
        Enabled: true
        HttpVersion: http1.1
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !Ref AlbDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          # CachingDisabled + AllViewer: the WebSocket upgrade headers and Origin reach the server.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

Outputs:
  WssUrl:
    Description: WebSocket URL for the browser client
    Value: !Sub wss://${Distribution.DomainName}
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
