[project]
name = "jhola"
version = "0.1.0"
description = "Jhola: WhatsApp kirana ordering agent (Strands + Bedrock, Cedar policies)"
readme = "README.md"
authors = [
    { name = "madmecodes", email = "ayushguptadev1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.98",
    "cedarpy>=4.12.0",
    "pillow>=12.3.0",
    "strands-agents>=1.56.0",
]

[project.scripts]
jhola = "jhola:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
